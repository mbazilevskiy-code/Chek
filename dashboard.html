<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chek Coach — дашборд</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --green: #008300;
  --green-track: #d9edd9;
  --blue: #2a78d6;
  --blue-track: #cde2fb;
  --aqua: #1baf7a;
  --good-text: #006300;
  --over-text: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --green: #0ca30c;
    --green-track: #1e3a20;
    --blue: #3987e5;
    --blue-track: #16304d;
    --aqua: #199e70;
    --good-text: #0ca30c;
    --over-text: #e66767;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px; line-height: 1.5;
}
header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 18px 24px; max-width: 1080px; margin: 0 auto;
}
h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.01em; }
h1 small { color: var(--muted); font-weight: 400; font-size: 0.8rem; margin-left: 8px; }
.spacer { flex: 1; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); padding: 6px 14px;
  font: inherit; font-size: 0.88rem; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--green); color: #fff; font-weight: 600; }
.seg button:focus-visible, .ghost:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.ghost {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 9px; padding: 6px 12px; font: inherit; font-size: 0.88rem; cursor: pointer;
}
.updated { color: var(--muted); font-size: 0.82rem; }
main { max-width: 1080px; margin: 0 auto; padding: 0 24px 60px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 6px 0 18px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile .lbl { color: var(--ink-2); font-size: 0.84rem; }
.tile .val { font-size: 1.7rem; font-weight: 600; margin: 2px 0 0; }
.tile .val small { font-size: 0.95rem; font-weight: 400; color: var(--muted); }
.tile .sub { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
.meter { height: 6px; border-radius: 3px; margin-top: 10px; overflow: hidden; }
.meter > div { height: 100%; border-radius: 3px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
.card.wide { grid-column: 1 / -1; }
.card h2 { font-size: 0.95rem; margin: 0 0 4px; font-weight: 600; }
.card .note { color: var(--muted); font-size: 0.8rem; margin: 0 0 8px; }
.chart { width: 100%; }
.chart svg { display: block; width: 100%; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } header { padding: 14px 16px; } main { padding: 0 16px 40px; } }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 0.74rem;
     text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.day td {
  color: var(--ink-2); font-weight: 600; background: transparent;
  border-bottom: 1px solid var(--baseline); padding-top: 14px; font-size: 0.84rem;
}
td.dish { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
#tip {
  position: fixed; pointer-events: none; z-index: 10; display: none;
  background: var(--ink); color: var(--page); padding: 6px 10px; border-radius: 8px;
  font-size: 0.82rem; line-height: 1.35; max-width: 260px;
  font-variant-numeric: tabular-nums;
}
#empty { text-align: center; color: var(--ink-2); padding: 70px 20px; }
#empty .big { font-size: 2rem; }
.err { color: var(--over-text); }
</style>
</head>
<body>
<header>
  <h1>🌿 Chek Coach<small>локальный дашборд</small></h1>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Период">
    <button id="d7" aria-pressed="true">7 дней</button>
    <button id="d30" aria-pressed="false">30 дней</button>
  </div>
  <button class="ghost" id="refresh">Обновить</button>
  <span class="updated" id="updated"></span>
</header>
<main>
  <div id="empty" hidden>
    <div class="big">🌱</div>
    <p><b>Данных пока нет.</b><br>Напиши боту в Telegram /start и пришли первое фото еды —<br>здесь появится вся картина.</p>
  </div>
  <div id="content" hidden>
    <section class="tiles" id="tiles"></section>
    <section class="grid">
      <div class="card">
        <h2>Калории по дням</h2>
        <p class="note" id="kcal-note"></p>
        <div class="chart" id="ch-kcal"></div>
      </div>
      <div class="card">
        <h2>Вода по дням</h2>
        <p class="note" id="water-note"></p>
        <div class="chart" id="ch-water"></div>
      </div>
      <div class="card wide">
        <h2>Оценка еды по Чеку</h2>
        <p class="note">Средний балл блюд за день, от 1 до 10</p>
        <div class="chart" id="ch-chek"></div>
      </div>
    </section>
    <section class="card">
      <h2>Журнал еды</h2>
      <div class="tablewrap"><table id="journal"></table></div>
    </section>
  </div>
</main>
<div id="tip"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (n) => (n ?? 0).toLocaleString("ru-RU");

let days = 7;
let data = null;

async function load() {
  try {
    const r = await fetch("/api/summary?days=" + days, {cache: "no-store"});
    data = await r.json();
    render();
  } catch (e) {
    $("empty").hidden = false;
    $("content").hidden = true;
    $("empty").innerHTML = '<div class="big">⚠️</div><p class="err">Не получилось получить данные. Бот запущен?</p>';
  }
}

function tile(label, valueHtml, sub, meter) {
  return `<div class="tile"><div class="lbl">${label}</div>
    <div class="val">${valueHtml}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ""}
    ${meter ?? ""}</div>`;
}

function meterHtml(part, total, color, track) {
  const pct = total ? Math.min(100, Math.round(part * 100 / total)) : 0;
  return `<div class="meter" style="background:${track}"><div style="width:${pct}%;background:${color}"></div></div>`;
}

function render() {
  if (!data || !data.ok) { $("empty").hidden = false; $("content").hidden = true; return; }
  $("empty").hidden = true; $("content").hidden = false;
  $("updated").textContent = "обновлено " + data.generated_at;

  const t = data.today, tg = data.targets, st = data.stats;
  const kcalSub = tg.kcal ? `из ${fmt(tg.kcal)} ккал` : "норма не задана — /profile в боте";
  const tiles = [
    tile("Калории сегодня", `${fmt(t.kcal)}${tg.kcal ? ` <small>/ ${fmt(tg.kcal)}</small>` : ""}`,
         tg.kcal ? `Б ${t.protein} · Ж ${t.fat} · У ${t.carbs}` : kcalSub,
         tg.kcal ? meterHtml(t.kcal, tg.kcal, css("--green"), css("--green-track")) : ""),
    tile("Вода сегодня", `${fmt(t.water)} <small>/ ${fmt(tg.water)}</small>`,
         t.water >= tg.water ? "мл · норма выполнена" : `мл · осталось ${fmt(tg.water - t.water)}`,
         meterHtml(t.water, tg.water, css("--blue"), css("--blue-track"))),
    tile("Средний Чек", st.avg_chek ? `${String(st.avg_chek).replace(".", ",")} <small>/ 10</small>` : "—",
         `за ${data.days} дн.`),
    tile("Тренировки", `${st.workouts_done}`, `выполнено за ${data.days} дн.`),
    tile("Working In", `${st.wi_streak} <small>дн. подряд</small>`, `${st.wi_days} из ${data.days} дн.`),
  ];
  $("tiles").innerHTML = tiles.join("");

  $("kcal-note").textContent = tg.kcal
    ? `Цель ${fmt(tg.kcal)} ккал · среднее за период ${fmt(st.avg_kcal)}`
    : `Среднее за период ${fmt(st.avg_kcal)} ккал`;
  $("water-note").textContent = `Цель ${fmt(tg.water)} мл · дней в норме: ${st.water_ok_days} из ${data.days}`;

  barChart($("ch-kcal"), data.series.map(s => ({label: s.label, v: s.kcal,
    tip: `${s.label} · ${fmt(s.kcal)} ккал · Б ${s.protein} Ж ${s.fat} У ${s.carbs}`})),
    {color: css("--green"), target: tg.kcal});
  barChart($("ch-water"), data.series.map(s => ({label: s.label, v: s.water,
    tip: `${s.label} · ${fmt(s.water)} мл`})),
    {color: css("--blue"), target: tg.water});
  lineChart($("ch-chek"), data.series.map(s => ({label: s.label, v: s.chek,
    tip: s.chek ? `${s.label} · Чек ${String(s.chek).replace(".", ",")}/10` : null})));

  renderJournal();
}

function niceMax(m) {
  if (m <= 0) return 100;
  const steps = [100, 200, 250, 500, 1000, 2000, 2500, 5000];
  for (const s of steps) { const k = Math.ceil(m / s); if (k <= 5) return k * s; }
  return Math.ceil(m / 5000) * 5000;
}

function svgEl(w, h) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.setAttribute("height", h);
  return s;
}
function add(parent, name, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  parent.appendChild(el);
  return el;
}
function topRoundedBar(x, y, w, h, r) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  const y0 = y + h;
  return `M ${x} ${y0} L ${x} ${y + r} Q ${x} ${y} ${x + r} ${y}` +
         ` L ${x + w - r} ${y} Q ${x + w} ${y} ${x + w} ${y + r} L ${x + w} ${y0} Z`;
}

const PADL = 44, PADR = 10, PADT = 14, PADB = 24, H = 190;

function frame(el, yMax, yTicks) {
  const w = Math.max(el.clientWidth || 560, 280);
  const svg = svgEl(w, H);
  const plotW = w - PADL - PADR, plotH = H - PADT - PADB;
  for (const tv of yTicks) {
    const y = PADT + plotH - (tv / yMax) * plotH;
    if (tv > 0) add(svg, "line", {x1: PADL, x2: w - PADR, y1: y, y2: y,
      stroke: css("--grid"), "stroke-width": 1});
    const lb = add(svg, "text", {x: PADL - 8, y: y + 4, "text-anchor": "end",
      fill: css("--muted"), "font-size": 11, style: "font-variant-numeric: tabular-nums"});
    lb.textContent = tv >= 1000 ? (tv / 1000) + "к" : tv;
  }
  add(svg, "line", {x1: PADL, x2: w - PADR, y1: PADT + plotH, y2: PADT + plotH,
    stroke: css("--baseline"), "stroke-width": 1});
  return {svg, w, plotW, plotH};
}

function xLabels(svg, items, plotW) {
  const n = items.length;
  const every = n > 12 ? Math.ceil(n / 8) : 1;
  items.forEach((it, i) => {
    if (i % every !== 0 && i !== n - 1) return;
    const cx = PADL + (i + 0.5) * (plotW / n);
    const lb = add(svg, "text", {x: cx, y: H - 7, "text-anchor": "middle",
      fill: css("--muted"), "font-size": 10.5, style: "font-variant-numeric: tabular-nums"});
    lb.textContent = it.label;
  });
}

function hover(svg, i, x, w, tipText) {
  if (!tipText) return;
  const hit = add(svg, "rect", {x, y: 0, width: w, height: H, fill: "transparent"});
  hit.addEventListener("mousemove", (e) => {
    const tip = $("tip");
    tip.textContent = tipText;
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 240) + "px";
    tip.style.top = (e.clientY + 14) + "px";
  });
  hit.addEventListener("mouseleave", () => { $("tip").style.display = "none"; });
}

function barChart(el, items, opts) {
  el.innerHTML = "";
  const vMax = niceMax(Math.max(opts.target || 0, ...items.map(d => d.v)) * 1.05);
  const ticks = [0, vMax / 2, vMax].map(Math.round);
  const {svg, plotW, plotH} = frame(el, vMax, ticks);
  const n = items.length, slot = plotW / n;
  const bw = Math.min(24, Math.max(4, slot - 2));
  items.forEach((d, i) => {
    const h = Math.round((d.v / vMax) * plotH);
    const x = PADL + i * slot + (slot - bw) / 2;
    if (d.v > 0) add(svg, "path", {d: topRoundedBar(x, PADT + plotH - h, bw, h, 4), fill: opts.color});
    hover(svg, i, PADL + i * slot, slot, d.tip);
  });
  if (opts.target) {
    const y = PADT + plotH - (opts.target / vMax) * plotH;
    add(svg, "line", {x1: PADL, x2: PADL + plotW, y1: y, y2: y,
      stroke: css("--ink-2"), "stroke-width": 1, "stroke-dasharray": "5 4"});
    const lb = add(svg, "text", {x: PADL + 3, y: y - 5, "text-anchor": "start",
      fill: css("--ink-2"), "font-size": 10.5});
    lb.textContent = "цель";
  }
  const last = items[items.length - 1];
  if (last && last.v > 0) {
    const h = Math.round((last.v / vMax) * plotH);
    const x = PADL + (n - 0.5) * slot;
    const lb = add(svg, "text", {x, y: Math.max(12, PADT + plotH - h - 6), "text-anchor": "middle",
      fill: css("--ink"), "font-size": 11, "font-weight": 600,
      style: "font-variant-numeric: tabular-nums"});
    lb.textContent = fmt(last.v);
  }
  xLabels(svg, items, plotW);
  el.appendChild(svg);
}

function lineChart(el, items) {
  el.innerHTML = "";
  const vMax = 10;
  const {svg, plotW, plotH} = frame(el, vMax, [0, 5, 10]);
  const n = items.length, slot = plotW / n;
  const pts = items.map((d, i) => d.v == null ? null : {
    x: PADL + (i + 0.5) * slot,
    y: PADT + plotH - (d.v / vMax) * plotH,
  });
  let path = "", started = false;
  pts.forEach(p => {
    if (!p) { started = false; return; }
    path += (started ? " L" : " M") + ` ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
    started = true;
  });
  if (path) add(svg, "path", {d: path, fill: "none", stroke: css("--aqua"),
    "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"});
  pts.forEach((p, i) => {
    if (p) add(svg, "circle", {cx: p.x, cy: p.y, r: 4.5, fill: css("--aqua"),
      stroke: css("--surface"), "stroke-width": 2});
    hover(svg, i, PADL + i * slot, slot, items[i].tip);
  });
  xLabels(svg, items, plotW);
  el.appendChild(svg);
}

function chekWord(v) {
  if (v >= 8.5) return "отлично";
  if (v >= 7) return "хорошо";
  if (v >= 5) return "средне";
  return "слабо";
}

function renderJournal() {
  const rows = [];
  rows.push("<tr><th>Время</th><th>Блюдо</th><th class='num'>ккал</th><th class='num'>Б</th><th class='num'>Ж</th><th class='num'>У</th><th class='num'>Чек</th></tr>");
  let curDate = null;
  const names = {};
  data.series.forEach(s => { names[s.date] = s.label; });
  if (!data.meals.length) {
    rows.push("<tr><td colspan='7' style='color:var(--muted)'>Записей за период нет</td></tr>");
  }
  for (const m of data.meals) {
    if (m.date !== curDate) {
      curDate = m.date;
      const s = data.series.find(x => x.date === m.date);
      const extras = s ? ` — ${fmt(s.kcal)} ккал · вода ${fmt(s.water)}${s.workout === "done" ? " · 🏋️" : ""}${s.wi ? " · 🧘" : ""}` : "";
      rows.push(`<tr class="day"><td colspan="7">${names[m.date] || m.date}${extras}</td></tr>`);
    }
    rows.push(`<tr><td class="num">${esc(m.time)}</td><td class="dish" title="${esc(m.dish)}">${esc(m.dish)}</td>` +
      `<td class="num">${fmt(Math.round(m.kcal || 0))}</td>` +
      `<td class="num">${Math.round(m.protein || 0)}</td><td class="num">${Math.round(m.fat || 0)}</td>` +
      `<td class="num">${Math.round(m.carbs || 0)}</td><td class="num">${m.chek_score ?? "—"}</td></tr>`);
  }
  $("journal").innerHTML = rows.join("");
}

function setDays(d) {
  days = d;
  $("d7").setAttribute("aria-pressed", d === 7 ? "true" : "false");
  $("d30").setAttribute("aria-pressed", d === 30 ? "true" : "false");
  load();
}
$("d7").addEventListener("click", () => setDays(7));
$("d30").addEventListener("click", () => setDays(30));
$("refresh").addEventListener("click", load);
let rsT = null;
window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => data && render(), 200); });
setInterval(load, 60000);
load();
</script>
</body>
</html>
