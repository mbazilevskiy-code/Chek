<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет тренера</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800&display=swap">
<style>
/* ============ токены: те же, что в client.html ============ */
:root{
  color-scheme:dark;
  --page:#0C100E; --card:#151B17; --card2:#1B2320;
  --ink:#EAF0E8; --ink2:#A8B3A4; --mut:#75816F;
  --line:rgba(255,255,255,.08); --grid:rgba(255,255,255,.07); --track:rgba(255,255,255,.10);
  --green:#3EA862; --blue:#5D97DD; --amber:#B4872F; --teal:#23A392; --red:#E4685F;
  --green-soft:rgba(62,168,98,.16); --blue-soft:rgba(93,151,221,.15);
  --amber-soft:rgba(180,135,47,.18); --red-soft:rgba(228,104,95,.16); --teal-soft:rgba(35,163,146,.16);
  --tip-bg:#242D28; --tip-ink:#EAF0E8;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.25);
}
/* Тёмная тема — единственная (фирменное решение, как у Oura/WHOOP): не зависит от темы устройства. */

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font-family:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.45;
  padding:18px 14px calc(30px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto}
@media(min-width:960px){
  .wrap{max-width:1020px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .col{display:flex;flex-direction:column;gap:14px}
  .roster{display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
@media(max-width:959px){
  .grid{display:flex;flex-direction:column;gap:12px} .col{display:contents}
  .roster{display:flex;flex-direction:column;gap:10px}
  /* на телефоне тренерское — наверх: кольца → подсветка → бриф → остальное */
  #heroC{order:-3} #alertCard{order:-2} #briefCard{order:-1}
}

/* ---------- шапка ---------- */
header{margin:2px 2px 14px}
.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:3px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.date{color:var(--ink2);font-size:13px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12.5px;font-weight:600;
  padding:5px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg button:focus-visible,.back:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}

.invite{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 12px;
  font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.invite code{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--ink);font-size:12.5px}
.invite .copy{margin-left:auto;border:1px solid var(--line);background:var(--card2);color:var(--ink);
  font:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:4px 10px;cursor:pointer}

/* ---------- карточки/чипы (как в client.html) ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:0 0 12px;
  display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;color:var(--ink2);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.crit{background:var(--red-soft);color:var(--red)}
.chip.mut{background:var(--track);color:var(--ink2)}
.nodata{color:var(--mut);font-size:13.5px;background:var(--card2);border:1px dashed var(--line);
  border-radius:12px;padding:14px;text-align:center}

/* ---------- ростер ---------- */
.client-card{cursor:pointer;transition:transform .12s ease}
.client-card:hover{transform:translateY(-1px)}
.cc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cc-name{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.cc-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.stat{flex:1;min-width:74px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:7px 10px}
.stat .v{font-size:15px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:10.5px;color:var(--ink2);font-weight:500}
.stat .l{font-size:10.5px;color:var(--mut);margin-top:0px}
.cc-open{margin-left:auto;color:var(--mut);font-size:18px}

/* ---------- детальная ---------- */
.back{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--green);
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;margin:0 0 12px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.dhead h1{font-size:21px}
.dmeta{color:var(--ink2);font-size:13px;margin:2px 0 12px}

/* кольца */
.rings{display:flex;justify-content:space-between;gap:6px;max-width:620px;margin:0 auto}
.ring{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ring svg{width:min(104px,26vw);height:auto;display:block}
.ring .num{font-size:24px;font-weight:800;letter-spacing:-.02em;fill:var(--ink)}
.ring .unit{font-size:10.5px;fill:var(--ink2);font-weight:500}
.ring .lab{font-size:12px;color:var(--ink2);font-weight:600}
.ring .sub{font-size:11px;color:var(--mut);margin-top:-3px}
@media(prefers-reduced-motion:no-preference){ .ring circle.p{transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1)} }

/* питание/бары */
.kline{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.kline .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.kline .of{color:var(--ink2);font-size:13.5px}
.macros{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.m{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;font-size:13px}
.m .n{color:var(--ink2);font-weight:600}
.m .bar{height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.m .bar i{display:block;height:100%;border-radius:4px;background:var(--green)}
.m .v{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12.5px}
.wb .m{grid-template-columns:86px 1fr 30px}
.quote{margin:10px 0 0;color:var(--mut);font-size:12.5px;border-left:2px solid var(--line);padding-left:9px}

.wline{display:flex;align-items:baseline;gap:8px}
.wline .big{font-size:26px;font-weight:800}
.wbar{height:12px;border-radius:7px;background:var(--track);overflow:hidden;margin:10px 0 2px}
.wbar i{display:block;height:100%;border-radius:7px;background:var(--blue)}

.chart{margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.axis{font-size:10px;fill:var(--mut)}
.gridln{stroke:var(--grid);stroke-width:1}
.target{stroke:var(--mut);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.bar-h{cursor:pointer}
.cap{color:var(--mut);font-size:11.5px;margin-top:6px}

.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fact{flex:1;min-width:84px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.fact .fv{font-size:17px;font-weight:800;letter-spacing:-.01em}
.fact .fv small{font-size:11px;color:var(--ink2);font-weight:500}
.fact .fl{font-size:11px;color:var(--mut);margin-top:1px}

.wkdots{display:flex;justify-content:space-between;margin:4px 0 10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--mut)}
.wd i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;background:var(--track);color:var(--mut);font-style:normal}
.wd i.done{background:var(--green-soft);color:var(--green)}
.wd i.skip{background:var(--red-soft);color:var(--red)}
.lastw{font-size:13.5px;color:var(--ink2)}
.lastw b{color:var(--ink)}

.supp{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:13.5px}
.srow .nm{font-weight:500}
.srow .nm small{color:var(--mut);font-weight:400;margin-left:5px}
.sdots{display:flex;gap:4px}
.sdots i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.sdots i.on{background:var(--green)}
.srow .sc{color:var(--ink2);font-size:12.5px;font-variant-numeric:tabular-nums}

.lab-t{width:100%;border-collapse:collapse;font-size:13px}
.lab-t td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lab-t tr:last-child td{border-bottom:none}
.lab-t .nm{color:var(--ink)}
.lab-t .vl{text-align:right;color:var(--ink2);white-space:nowrap}
.lab-t .fg{text-align:right}
.morelink{background:none;border:0;color:var(--green);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px 0 0}

.weight-top{display:flex;align-items:baseline;gap:10px}
.weight-top .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.delta{font-size:13px;font-weight:600}
.delta.g{color:var(--green)} .delta.b{color:var(--red)} .delta.n{color:var(--ink2)}

/* ---------- тренерское ---------- */
.notes{display:flex;flex-direction:column;gap:9px}
.note-row{display:flex;gap:10px;font-size:13.5px;align-items:baseline}
.note-row .nd{color:var(--mut);font-size:11.5px;flex:0 0 46px;font-variant-numeric:tabular-nums}
.brief-card{border:1px solid var(--green);background:linear-gradient(180deg,var(--card),var(--card2))}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;
  padding:9px 16px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.brief-out{white-space:pre-wrap;font-size:13.5px;color:var(--ink2);margin:12px 0 0;line-height:1.55}
.brief-out b{color:var(--ink)}
.rowbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}

footer{margin:22px 4px 0;color:var(--mut);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--mut)}

#tip{position:fixed;z-index:30;background:var(--tip-bg);color:var(--tip-ink);font-size:12px;font-weight:500;
  padding:5px 9px;border-radius:8px;pointer-events:none;opacity:0;transform:translate(-50%,-130%);
  white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#tip b{font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <!-- ======== СПИСОК ======== -->
  <div id="listView">
    <header>
      <div class="brand" id="brand">Кабинет тренера</div>
      <div class="hrow">
        <h1 id="coachname">Клиенты</h1>
        <span class="date" id="updated"></span>
      </div>
    </header>
    <div class="invite" id="invite" hidden>
      🔗 Ссылка для клиентов: <code id="botlink"></code>
      <button class="copy" id="copyLink">Скопировать</button>
    </div>
    <div class="roster" id="roster"></div>
    <div id="emptyRoster" class="nodata" hidden>Клиентов пока нет — отправь ссылку выше, бот сам всё объяснит.</div>
  </div>

  <!-- ======== КАРТОЧКА КЛИЕНТА ======== -->
  <div id="detailView" hidden>
    <button class="back" id="back">← Все клиенты</button>
    <header style="margin-bottom:10px">
      <div class="dhead"><h1 id="cname"></h1><span id="cpills"></span>
        <div class="seg" role="group" aria-label="Период">
          <button id="p7" aria-pressed="true">Неделя</button>
          <button id="p30" aria-pressed="false">Месяц</button>
        </div>
      </div>
      <div class="dmeta" id="cmeta"></div>
    </header>

    <div class="grid">
      <div class="card" id="heroC" style="grid-column:1/-1"><div class="rings" id="rings"></div></div>
      <div class="col">
        <div class="card" id="alertCard" hidden></div>
        <div class="card" id="foodCard"></div>
        <div class="card" id="waterCard"></div>
        <div class="card" id="trainCard"></div>
        <div class="card" id="wbCard"></div>
      </div>
      <div class="col">
        <div class="card brief-card" id="briefCard"></div>
        <div class="card" id="sleepCard"></div>
        <div class="card" id="weightCard"></div>
        <div class="card" id="suppCard"></div>
        <div class="card" id="remCard"></div>
        <div class="card" id="labCard"></div>
      </div>
    </div>
  </div>

  <footer><span id="footbrand"></span><a href="/privacy">Конфиденциальность</a></footer>
</div>
<div id="tip" role="status"></div>

<script>
"use strict";
/* ================= МОК-ДАННЫЕ =================
   Живые эндпоинты: /coach/api/me, /coach/api/clients, /coach/api/client?uid=&days=30, POST /coach/api/brief?uid= */
const KEY=new URLSearchParams(location.search).get("key")||"";
const q=(p)=>p+(p.includes("?")?"&":"?")+"key="+encodeURIComponent(KEY);

function genSeries(seed, wBase){
  const out=[]; const today=new Date("2026-08-28"); let w=wBase;
  for(let i=29;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const wd=d.getDay();
    w+=(Math.sin(i*seed)*0.09-0.02);
    out.push({date:d.toISOString().slice(0,10),
      label:["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][wd],
      kcal:Math.max(800,1300+Math.round(300*Math.sin(i*seed))+(wd%6===0?250:0)),
      water:1100+Math.round(600*Math.abs(Math.sin(i*seed*1.4))),
      chek:4+Math.round(3*Math.abs(Math.sin(i*seed*0.8))),
      workout:(wd===1||wd===3||wd===5)?(i%9===4?"skip":"done"):"none",
      sleep_h:+(5.5+1.8*Math.abs(Math.sin(i*seed*0.6))).toFixed(1),
      readiness:Math.round(52+28*Math.abs(Math.sin(i*seed*0.5))),
      weight:+w.toFixed(1)});
  }
  return out;
}
const MOCK_ME={name:"Алексей Кузнецов", brand:"Кузнецов · Метод", bot_username:"kuznetsov_coach_bot"};
const MOCK_CLIENTS=[
  {uid:1,name:"Марина К.",flags:[{level:"crit",text:"готовность 3 дня низкая"},{level:"warn",text:"ест ниже нормы"}],
   days_logged:6,kcal_today:1450,kcal_target:2400,avg_chek:6.4,water_today:1500,water_target:2200,workouts_done:2},
  {uid:2,name:"Дмитрий С.",flags:[{level:"ok",text:"в порядке"}],
   days_logged:7,kcal_today:2100,kcal_target:2400,avg_chek:7.8,water_today:2600,water_target:2800,workouts_done:3},
  {uid:3,name:"Аня Р.",flags:[{level:"crit",text:"молчит 3 дня"}],
   days_logged:2,kcal_today:0,kcal_target:1600,avg_chek:null,water_today:0,water_target:2000,workouts_done:0},
  {uid:4,name:"Игорь В.",flags:[{level:"ok",text:"в порядке"}],
   days_logged:5,kcal_today:1900,kcal_target:2500,avg_chek:6.9,water_today:2400,water_target:3000,workouts_done:4},
  {uid:5,name:"Лена Т.",flags:[{level:"warn",text:"качество еды низкое"}],
   days_logged:6,kcal_today:980,kcal_target:1650,avg_chek:4.6,water_today:1900,water_target:2200,workouts_done:1},
];
function mockDetail(uid){
  const c=MOCK_CLIENTS.find(x=>x.uid===uid)||MOCK_CLIENTS[0];
  return {
    name:c.name, meta:{sex:"жен", age:34, goal:"снижение веса"},
    flags:c.flags,
    me:{brand:MOCK_ME.brand, coach:MOCK_ME.name},
    today:{kcal:c.kcal_today, protein:74, fat:48, carbs:132, water:c.water_today},
    targets:{kcal:c.kcal_target, protein:110, fat:70, carbs:250, water:c.water_target},
    stats:{avg_chek:c.avg_chek??5.5},
    series:genSeries(0.9+uid*0.17, 82+uid),
    wellbeing:{avg:{energy:5.4,mood:6.1,stress:6.8,libido:4.2},latest:{note:"Сплю плохо, много стресса на работе"}},
    supplements:[
      {name:"Витамин D 5000",timing:"утром",plan:7,dots:[1,1,1,0,1,1,1]},
      {name:"Омега-3",timing:"с едой",plan:7,dots:[1,1,0,0,1,1,0]},
      {name:"Магний",timing:"на ночь",plan:7,dots:[0,1,0,0,1,0,0]},
    ],
    reminders:[
      {kind:"water",text:"попить воды",when:"каждые 2 ч, 09:00–21:00"},
      {kind:"supplement",text:"магний",when:"ежедневно в 22:00"},
      {kind:"workout",text:"тренировка",when:"пн·ср·пт в 18:00"}],
    labs:{last_date:"10.08",total:14,markers:[
      {name:"Ферритин",value:"18 нг/мл",ref:"30–150",flag:"низко",trend:"↓ было 24"},
      {name:"Витамин D",value:"19 нг/мл",ref:"30–100",flag:"низко",trend:"↑ было 16"},
      {name:"Гемоглобин",value:"128 г/л",ref:"120–150",flag:"норма",trend:"↑ было 126"},
      {name:"ТТГ",value:"2,1 мЕд/л",ref:"0,4–4,0",flag:"норма",trend:"↓ было 2,3"},
    ]},
    workouts:{last:{when:"вчера",dur:40,kcal:310,src:"Oura",desc:"турник + брусья"},month_done:9},
    gadgets:{primary:"oura",oura:{connected:true,readiness:64,sleep_h:6.2,hrv:48,rhr:58},whoop:{connected:false}},
    weight:{current:82.4,delta30:-0.6},
    notes:[
      {date:"27.08",text:"Спросила, можно ли кофе после 18:00 — переадресовал тебе."},
      {date:"25.08",text:"3 дня подряд ужин после 22:00, сон в эти ночи короче на ~1 ч."},
    ],
  };
}
const MOCK_BRIEF = "ЧТО ПРОИСХОДИТ\nМарина третью неделю недосыпает: готовность 60–64, сон около 6 часов. Качество еды просело — Чек 6,4/10, калории ниже нормы (в среднем 1 340 при цели 2 400). Стресс высокий (6,8/10).\n\nСВЯЗИ\nНизкий ферритин (18) и витамин D (19) вместе с недосыпом и дефицитом калорий — классическая связка «нет сил». Поздние ужины совпадают с короткими ночами.\n\nНА ЧТО ОБРАТИТЬ ВНИМАНИЕ\n— Ферритин и витамин D ниже нормы второй месяц подряд.\n— Ест заметно ниже нормы: риск терять мышцы, а не жир.\n— Магний на ночь пропускает 5 дней из 7.";

const $=(id)=>document.getElementById(id);
const fmt=(n)=>Math.round(n||0).toLocaleString("ru-RU");
const f1=(n)=>(+n).toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1});
let state={days:7, uid:null, detail:null};

/* ---------- тултип ---------- */
const tip=$("tip");
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(el=>{
    const show=()=>{ tip.innerHTML=el.dataset.tip; tip.style.opacity=1;
      const r=el.getBoundingClientRect(); tip.style.left=(r.left+r.width/2)+"px"; tip.style.top=(r.top)+"px"; };
    const hide=()=>{ tip.style.opacity=0; };
    el.addEventListener("pointerenter",show); el.addEventListener("pointerleave",hide);
    el.addEventListener("click",()=>{ show(); setTimeout(hide,1600); });
  });
}
addEventListener("scroll",()=>{ tip.style.opacity=0; },{passive:true});

/* ---------- примитивы (как в client.html) ---------- */
function ring(val,max,color,centerTxt,unitTxt){
  const r=40,C=2*Math.PI*r,frac=Math.max(0,Math.min(1,(val||0)/max)),off=C*(1-frac);
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${centerTxt} ${unitTxt||''}">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--track)" stroke-width="9"/>
    <circle class="p" cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 50 50)"/>
    <text class="num" x="50" y="50" text-anchor="middle" dominant-baseline="central">${centerTxt}</text>
    <text class="unit" x="50" y="66" text-anchor="middle">${unitTxt||""}</text></svg>`;
}
function hbar(name,val,target,unit){
  const pct=Math.min(100,Math.round(100*val/target));
  return `<div class="m"><span class="n">${name}</span><span class="bar"><i style="width:${pct}%"></i></span>
    <span class="v">${fmt(val)} / ${fmt(target)} ${unit}</span></div>`;
}
function barsChart(items,{target,colorVar,unit}){
  const W=320,H=92,padB=16,padT=6,n=items.length;
  const max=Math.max(target||0,...items.map(d=>d.v))*1.08;
  const bw=Math.min(18,(W/n)-2);
  const y=(v)=>H-padB-(v/max)*(H-padB-padT);
  let out=`<line class="gridln" x1="0" x2="${W}" y1="${y(max*0.5).toFixed(1)}" y2="${y(max*0.5).toFixed(1)}"/>`;
  items.forEach((d,i)=>{
    const x=(W/n)*i+((W/n)-bw)/2,bh=Math.max(2,(d.v/max)*(H-padB-padT));
    out+=`<rect class="bar-h" x="${x.toFixed(1)}" y="${(H-padB-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3"
      fill="var(${colorVar})" data-tip="<b>${fmt(d.v)}</b> ${unit} · ${d.date||d.l}"/>`;
    if(d.l!==undefined && (n<=7||i%5===0)) out+=`<text class="axis" x="${(x+bw/2).toFixed(1)}" y="${H-3}" text-anchor="middle">${d.l}</text>`;
  });
  if(target) out+=`<line class="target" x1="0" x2="${W}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${out}</svg></div>`;
}
function lineChart(items,{target,colorVar,unit,ymin=0,ymax}){
  const W=320,H=92,padB=16,padT=8,n=items.length;
  const vals=items.map(d=>d.v).filter(v=>v!=null);
  const max=ymax||Math.max(target||0,...vals)*1.06,min=ymin;
  const x=(i)=>6+i*(W-12)/(n-1),y=(v)=>H-padB-((v-min)/(max-min))*(H-padB-padT);
  let d="",started=false,dots="",labels="";
  let out=`<line class="gridln" x1="0" x2="${W}" y1="${y(min+(max-min)*0.5).toFixed(1)}" y2="${y(min+(max-min)*0.5).toFixed(1)}"/>`;
  items.forEach((p,i)=>{
    if(p.v==null){started=false;return;}
    d+=(started?" L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1);started=true;
    const last=i===n-1;
    dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last?4:2.6}" fill="var(${colorVar})"
      stroke="var(--card)" stroke-width="${last?2:1.2}" class="bar-h" data-tip="<b>${f1(p.v)}</b> ${unit} · ${p.date||p.l}"/>`;
    if(p.l!==undefined && (n<=7||i%5===0)) labels+=`<text class="axis" x="${x(i).toFixed(1)}" y="${H-3}" text-anchor="middle">${p.l}</text>`;
  });
  if(target) out+=`<line class="target" x1="0" x2="${W}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/>`;
  out+=`<path d="${d}" fill="none" stroke="var(${colorVar})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${out}${dots}${labels}</svg></div>`;
}
function spark(items,colorVar){
  const W=120,H=34,n=items.length,vals=items.map(d=>d.v);
  const max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
  const x=(i)=>2+i*(W-4)/(n-1),y=(v)=>H-4-((v-min)/rng)*(H-8);
  let d="";vals.forEach((v,i)=>{d+=(i?" L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1);});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:120px"><path d="${d}" fill="none" stroke="var(${colorVar})" stroke-width="2" stroke-linecap="round"/>
  <circle cx="${x(n-1).toFixed(1)}" cy="${y(vals[n-1]).toFixed(1)}" r="3.4" fill="var(${colorVar})" stroke="var(--card)" stroke-width="1.6"/></svg>`;
}
function readinessColor(v){return v==null?"var(--mut)":v>=70?"var(--green)":v>=45?"var(--amber)":"var(--red)";}
function readinessWord(v){return v==null?"—":v>=70?"хорошая":v>=45?"средняя":"низкая";}
const flagChip=(f)=>`<span class="chip ${f.level==='ok'?'ok':f.level==='warn'?'warn':'crit'}">${f.level==='ok'?'✓':f.level==='warn'?'⚠':'●'} ${f.text}</span>`;

/* ---------- ростер ---------- */
async function loadList(){
  let me=MOCK_ME, clients=MOCK_CLIENTS;
  try{ const r=await fetch(q("/coach/api/me"),{cache:"no-store"}); if(r.ok) me=await r.json(); }catch(e){}
  try{ const r=await fetch(q("/coach/api/clients"),{cache:"no-store"}); if(r.ok){const j=await r.json(); if(j.clients) clients=j.clients;} }catch(e){}
  $("brand").textContent=me.brand||"Кабинет тренера";
  $("coachname").textContent="Клиенты";
  $("footbrand").textContent=(me.brand||"")+" · кабинет тренера";
  $("updated").textContent="обновлено "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  if(me.bot_username){ $("invite").hidden=false; $("botlink").textContent="t.me/"+me.bot_username;
    $("copyLink").onclick=async()=>{ try{ await navigator.clipboard.writeText("https://t.me/"+me.bot_username);
      $("copyLink").textContent="Скопировано ✓"; setTimeout(()=>$("copyLink").textContent="Скопировать",1500);}catch(e){} }; }
  const order={crit:0,warn:1,ok:2};
  clients=[...clients].sort((a,b)=>order[a.flags[0]?.level??"ok"]-order[b.flags[0]?.level??"ok"]);
  $("emptyRoster").hidden=clients.length>0;
  $("roster").innerHTML=clients.map(c=>`
    <div class="card client-card" data-uid="${c.uid}" role="button" tabindex="0" aria-label="Открыть ${c.name}">
      <div class="cc-top"><span class="cc-name">${c.name}</span>${c.flags.map(flagChip).join(" ")}<span class="cc-open">›</span></div>
      <div class="cc-stats">
        <div class="stat"><div class="v">${fmt(c.kcal_today)}${c.kcal_target?` <small>/ ${fmt(c.kcal_target)}</small>`:""}</div><div class="l">ккал сегодня</div></div>
        <div class="stat"><div class="v">${c.avg_chek!=null?f1(c.avg_chek)+'<small>/10</small>':"—"}</div><div class="l">Чек 7д</div></div>
        <div class="stat"><div class="v">${f1(c.water_today/1000)}<small> / ${f1(c.water_target/1000)} л</small></div><div class="l">вода</div></div>
        <div class="stat"><div class="v">${c.days_logged}<small>/7</small></div><div class="l">актив</div></div>
      </div>
    </div>`).join("");
  document.querySelectorAll(".client-card").forEach(el=>{
    const open=()=>openClient(+el.dataset.uid);
    el.addEventListener("click",open);
    el.addEventListener("keydown",(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
  });
}

/* ---------- карточка клиента ---------- */
async function openClient(uid){
  state.uid=uid; state.days=7;
  $("listView").hidden=true; $("detailView").hidden=false; scrollTo(0,0);
  let D=null;
  try{ const r=await fetch(q(`/coach/api/client?uid=${uid}&days=30`),{cache:"no-store"}); if(r.ok) D=await r.json(); }catch(e){}
  if(!D||!D.series) D=mockDetail(uid);
  state.detail=D;
  renderDetail();
}
function renderDetail(){
  const D=state.detail, S=D.series.slice(-state.days), S7=D.series.slice(-7);
  const t=D.today,tg=D.targets,g=D.gadgets||{};
  const prim=(g.primary==="whoop"?g.whoop:g.oura)||{connected:false};
  const primName=g.primary==="whoop"?"WHOOP":"Oura";
  $("p7").setAttribute("aria-pressed",state.days===7);
  $("p30").setAttribute("aria-pressed",state.days===30);
  $("cname").textContent=D.name;
  $("cpills").innerHTML=(D.flags||[]).map(flagChip).join(" ");
  const meta=D.meta||{};
  $("cmeta").textContent=[meta.sex,meta.age?meta.age+" лет":null,meta.goal?("цель: "+meta.goal):null].filter(Boolean).join(" · ");

  const rc=prim.connected?readinessColor(prim.readiness):"var(--mut)";
  $("rings").innerHTML=`
    <div class="ring">${ring(t.kcal,tg.kcal,"var(--green)",fmt(t.kcal),"из "+fmt(tg.kcal))}
      <span class="lab">Питание</span><span class="sub">ккал сегодня</span></div>
    <div class="ring">${prim.connected?ring(prim.readiness,100,rc,prim.readiness,readinessWord(prim.readiness)):ring(0,100,"var(--mut)","—","")}
      <span class="lab">Готовность</span><span class="sub">${prim.connected?primName:"гаджет не подключён"}</span></div>
    <div class="ring">${prim.connected?ring(prim.sleep_h,8,"var(--blue)",f1(prim.sleep_h),"из 8 ч"):ring(0,8,"var(--mut)","—","")}
      <span class="lab">Сон</span><span class="sub">${prim.connected?"прошлая ночь":"—"}</span></div>`;

  /* заметки ассистента */
  if(D.notes&&D.notes.length){
    $("alertCard").hidden=false;
    $("alertCard").innerHTML=`<h2>Ассистент подсветил</h2><div class="notes">
      ${D.notes.map(n=>`<div class="note-row"><span class="nd">${n.date}</span><span>${n.text}</span></div>`).join("")}</div>`;
  } else $("alertCard").hidden=true;

  $("foodCard").innerHTML=`
    <h2>Питание <span class="r"><span class="chip ${D.stats.avg_chek>=6?'ok':'warn'}">Чек ${f1(D.stats.avg_chek)}/10</span></span></h2>
    <div class="kline"><span class="big">${fmt(t.kcal)}</span><span class="of">из ${fmt(tg.kcal)} ккал</span></div>
    <div class="macros">${hbar("Б",t.protein,tg.protein,"г")}${hbar("Ж",t.fat,tg.fat,"г")}${hbar("У",t.carbs,tg.carbs,"г")}</div>
    ${barsChart(S.map(d=>({v:d.kcal,l:d.label,date:d.date})),{target:tg.kcal,colorVar:"--green",unit:"ккал"})}
    <div class="cap">Калории по дням · пунктир — норма клиента</div>`;

  const wp=Math.min(100,Math.round(100*t.water/tg.water));
  $("waterCard").innerHTML=`
    <h2>Вода</h2>
    <div class="wline"><span class="big">${f1(t.water/1000)}</span><span class="of">из ${f1(tg.water/1000)} л</span>
      <span style="margin-left:auto" class="chip ${wp>=100?'ok':'mut'}">${wp}%</span></div>
    <div class="wbar"><i style="width:${wp}%"></i></div>
    ${barsChart(S.map(d=>({v:d.water,l:d.label,date:d.date})),{target:tg.water,colorVar:"--blue",unit:"мл"})}`;

  const wk=S7.map(d=>({l:d.label,s:d.workout}));
  const lastW=D.workouts&&D.workouts.last;
  $("trainCard").innerHTML=`
    <h2>Тренировки ${D.workouts?`<span class="r">${D.workouts.month_done} за месяц</span>`:""}</h2>
    <div class="wkdots">${wk.map(d=>`<span class="wd"><i class="${d.s==='done'?'done':d.s==='skip'?'skip':''}">${d.s==='done'?'✓':d.s==='skip'?'—':''}</i>${d.l}</span>`).join("")}</div>
    ${lastW?`<div class="lastw">Последняя: <b>${lastW.when}</b>, ${lastW.dur} мин · <b>${lastW.kcal} ккал</b>
      <span style="color:var(--mut)">(${lastW.src})</span><br><span style="color:var(--mut)">${lastW.desc||""}</span></div>`
      :`<div class="nodata">Тренировок пока нет</div>`}`;

  if(D.wellbeing&&D.wellbeing.avg){
    const a=D.wellbeing.avg;
    const row=(nm,v,cv)=>v==null?"":`<div class="m"><span class="n">${nm}</span>
      <span class="bar"><i style="width:${v*10}%;background:var(${cv})"></i></span><span class="v">${f1(v)}</span></div>`;
    $("wbCard").innerHTML=`<h2>Самочувствие <span class="r">среднее за неделю</span></h2>
      <div class="wb">${row("Энергия",a.energy,"--amber")}${row("Настроение",a.mood,"--blue")}${row("Стресс",a.stress,"--red")}${row("Либидо",a.libido,"--teal")}</div>
      ${D.wellbeing.latest?.note?`<p class="quote">«${D.wellbeing.latest.note}»</p>`:""}`;
  } else $("wbCard").innerHTML=`<h2>Самочувствие</h2><div class="nodata">Данных нет</div>`;

  if(prim.connected){
    $("sleepCard").innerHTML=`
      <h2>Сон и восстановление <span class="r"><span class="chip ok">${primName} · основной</span></span></h2>
      ${lineChart(S.map(d=>({v:d.sleep_h,l:d.label,date:d.date})),{target:8,colorVar:"--blue",unit:"ч",ymin:4,ymax:9.4})}
      <div class="cap">Сон по ночам · пунктир — цель 8 ч</div>
      <div class="facts">
        <div class="fact"><div class="fv">${prim.hrv} <small>мс</small></div><div class="fl">HRV</div></div>
        <div class="fact"><div class="fv">${prim.rhr} <small>уд/мин</small></div><div class="fl">пульс покоя</div></div>
        <div class="fact"><div class="fv" style="color:${readinessColor(prim.readiness)}">${prim.readiness}</div><div class="fl">готовность</div></div>
      </div>
      <div style="margin-top:10px">${(g.whoop&&g.whoop.connected)?'<span class="chip ok">WHOOP подключён</span>':'<span class="chip mut">WHOOP не подключён</span>'}</div>`;
  } else $("sleepCard").innerHTML=`<h2>Сон и восстановление</h2><div class="nodata">Гаджет не подключён — клиент может сказать ассистенту «подключи кольцо»</div>`;

  if(D.weight&&D.weight.current!=null){
    const ws=D.series.filter(d=>d.weight!=null).slice(-30).map(d=>({v:d.weight}));
    const dcls=D.weight.delta30<0?"g":D.weight.delta30>0?"b":"n";
    $("weightCard").innerHTML=`<h2>Вес</h2><div class="weight-top">
      <span class="big">${f1(D.weight.current)} <small style="font-size:14px;color:var(--ink2);font-weight:500">кг</small></span>
      ${D.weight.delta30!=null?`<span class="delta ${dcls}">${D.weight.delta30>0?"+":""}${f1(D.weight.delta30)} за месяц</span>`:""}
      ${ws.length>2?`<span style="margin-left:auto">${spark(ws,"--green")}</span>`:""}</div>`;
  } else $("weightCard").innerHTML=`<h2>Вес</h2><div class="nodata">Данных нет</div>`;

  if(D.supplements&&D.supplements.length){
    $("suppCard").innerHTML=`<h2>БАДы <span class="r">эта неделя</span></h2><div class="supp">
      ${D.supplements.map(s=>{const taken=s.dots.filter(Boolean).length;
        return `<div class="srow"><span class="nm">${s.name}<small>${s.timing}</small></span>
          <span class="sdots">${s.dots.map(x=>`<i class="${x?'on':''}"></i>`).join("")}</span>
          <span class="sc">${taken} из ${s.plan}</span></div>`;}).join("")}</div>`;
  } else $("suppCard").innerHTML=`<h2>БАДы</h2><div class="nodata">Данных нет</div>`;

  /* напоминания */
  if(!D.reminders || !D.reminders.length){
    $("remCard").innerHTML = `<h2>Напоминания</h2>
      <div class="nodata">Напоминаний нет — клиент задаёт их словами в боте.</div>`;
  } else
  $("remCard").innerHTML = `<h2>Напоминания</h2>
    <div class="supp">
    ${D.reminders.map(r=>`<div class="srow"><span class="nm">${r.text}</span>
      <span class="sc">${r.when}</span></div>`).join("")}
    </div>`;

  if(D.labs&&D.labs.markers&&D.labs.markers.length){
    const abn=D.labs.markers.filter(m=>m.flag!=="норма");
    const rows=(list)=>list.map(m=>`<tr><td class="nm">${m.name}</td>
      <td class="vl">${m.value}<br><small style="color:var(--mut)">${m.ref} · ${m.trend}</small></td>
      <td class="fg"><span class="chip ${m.flag==="норма"?"ok":"warn"}">${m.flag==="норма"?"норма":"⚠ "+m.flag}</span></td></tr>`).join("");
    $("labCard").innerHTML=`<h2>Анализы <span class="r">от ${D.labs.last_date}</span></h2>
      ${abn.length?`<p style="margin:0 0 6px;font-size:13.5px;color:var(--ink2)">${abn.length} из ${D.labs.total} вне нормы</p>`:""}
      <table class="lab-t" id="labRows">${rows(D.labs.markers.slice(0,3))}</table>
      <button class="morelink" id="labMore">Показать все ${D.labs.total} →</button>`;
    $("labMore").addEventListener("click",()=>{ $("labRows").innerHTML=rows(D.labs.markers); $("labMore").remove(); });
  } else $("labCard").innerHTML=`<h2>Анализы</h2><div class="nodata">Данных нет — клиент присылает боту фото или PDF бланка</div>`;

  /* AI-бриф */
  $("briefCard").innerHTML=`
    <h2>AI-бриф недели</h2>
    <p style="margin:0;font-size:13px;color:var(--ink2)">Свяжет еду, сон, анализы и самочувствие в короткий разбор (30–60 сек).</p>
    <div class="rowbtns"><button class="btn primary" id="briefBtn">Собрать бриф</button></div>
    <div id="briefOut"></div>`;
  $("briefBtn").addEventListener("click",makeBrief);

  bindTips(document.body);
}
async function makeBrief(){
  const btn=$("briefBtn"),out=$("briefOut");
  btn.disabled=true;btn.textContent="Думаю…";
  let text=null;
  try{ const r=await fetch(q(`/coach/api/brief?uid=${state.uid}`),{method:"POST"});
    if(r.ok){const j=await r.json(); text=j.brief;} }catch(e){}
  if(!text) text=MOCK_BRIEF;
  out.innerHTML=`<div class="brief-out">${text.replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/^([А-ЯЁ ]{4,})$/gm,"<b>$1</b>")}</div>
    <div class="rowbtns"><button class="btn" id="copyBrief">Скопировать</button></div>`;
  $("copyBrief").addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(text);
    $("copyBrief").textContent="Скопировано ✓"; }catch(e){} });
  btn.disabled=false;btn.textContent="Собрать бриф";
}

$("back").addEventListener("click",()=>{ $("detailView").hidden=true; $("listView").hidden=false; loadList(); });
$("p7").addEventListener("click",()=>{state.days=7;renderDetail();});
$("p30").addEventListener("click",()=>{state.days=30;renderDetail();});
loadList();
</script>
